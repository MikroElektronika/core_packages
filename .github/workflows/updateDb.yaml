name: Update Canonical Database

on:
  workflow_dispatch:
    inputs:
      release_version:
        type: string
        description: Core release version used by the update
        default: latest
      select_index:
        type: choice
        description: Database channel
        options: [Development, Experimental, Live]
        default: Development

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Dispatch and wait for canonical database update
        env:
          GENERAL_PACKAGES_TOKEN: ${{ secrets.MIKROE_ACTIONS_KEY }}
        run: |
          python3 scripts/trigger_general_database_update.py \
            --channel '${{ inputs.select_index }}' \
            --operation refresh \
            --core-version '${{ inputs.release_version }}' \
            --sdk-version latest \
            --mcus-only false \
            --wait
