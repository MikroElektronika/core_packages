name: Publish Database Update Source

on:
  push:
    branches: [main]
    paths:
      - 'resources/queries/**'
      - 'scripts/package_database_update_source.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: core-database-update-source
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Authorize Mikroe Actions App
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.MIKROE_ACTIONS }}
          private-key: ${{ secrets.MIKROE_ACTIONS_KEY_AUTHORIZE }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Build source bundle
        run: |
          python3 scripts/package_database_update_source.py \
            --source-ref '${{ github.sha }}' \
            --output database_update_source.7z

      - name: Replace bundle on latest release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          tag="$(gh release view --json tagName --jq .tagName)"
          gh release upload "$tag" database_update_source.7z --clobber
