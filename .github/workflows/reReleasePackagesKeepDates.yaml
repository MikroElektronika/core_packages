name: Release new version for packages

on:
  workflow_dispatch:
    inputs:
      release_names:
        type: string
        description: Which Release to Update? (Type the name of release(s) without version)
        default: "RENESAS MCU Support packages for GCC & Clang|MCU Support packages for XC"

jobs:
  re-release-dont-update-dates:
    runs-on: ubuntu-latest
    steps:
      - name: Authorize Mikroe Actions App
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.MIKROE_ACTIONS }}
          private-key: ${{ secrets.MIKROE_ACTIONS_KEY_AUTHORIZE }}
          owner: MikroElektronika
          repositories: |
            core_packages
            general_packages

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Clean the image
        uses: ./.github/actions/aggressive-cleanup

      - name: Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get install p7zip-full
          pip install -r scripts/requirements/shared.txt
          pip install -r scripts/requirements/release.txt


      - name: Download database from general_packages for read-only packaging
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          rm -rf .central-db
          mkdir -p .central-db
          gh release download --repo MikroElektronika/general_packages --pattern 'database.7z' --dir .central-db
          7z x -y -o.central-db/content .central-db/database.7z >/dev/null
          cp .central-db/content/necto_db.db necto_db.db

      - name: Run Package Script
        env:
          DB_PATH: ${{ secrets.DB_PATH }}
          ES_HOST: ${{ secrets.ES_HOST }}
          ES_USER: ${{ secrets.ES_USER }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_INDEX_TEST: ${{ secrets.ES_INDEX_TEST }}
          ES_INDEX_LIVE: ${{ secrets.ES_INDEX_LIVE }}
        run: python -u scripts/package.py ${{ secrets.GITHUB_TOKEN }} ${{ github.repository }} "latest" "--releases_to_update" "${{ github.event.inputs.release_names }}"
