name: Update Canonical Database From mikroSDK

on:
  repository_dispatch:
    types: [trigger-workflow-update-database-from-sdk]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Authorize Mikroe Actions App
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.MIKROE_ACTIONS }}
          private-key: ${{ secrets.MIKROE_ACTIONS_KEY_AUTHORIZE }}

      - name: Checkout schema source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.client_payload.branch || 'main' }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements/shared.txt
          pip install -r scripts/requirements/databases.txt
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Update canonical database from mikroSDK release
        if: github.event.client_payload.skip_database != true
        env:
          GENERAL_PACKAGES_TOKEN: ${{ secrets.MIKROE_ACTIONS_KEY }}
        run: |
          python3 scripts/trigger_general_database_update.py \
            --channel '${{ github.event.client_payload.index }}' \
            --operation sdk \
            --core-version latest \
            --sdk-version '${{ github.event.client_payload.version }}' \
            --mcus-only false \
            --wait

      - name: Upload and re-index Schemas
        env:
          ES_HOST: ${{ secrets.ES_HOST }}
          ES_USER: ${{ secrets.ES_USER }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
        run: |
          case '${{ github.event.client_payload.index }}' in
            Live)
              index='${{ secrets.ES_INDEX_LIVE }}'
              ;;
            Experimental)
              index='${{ secrets.ES_INDEX_EXPERIMENTAL }}'
              ;;
            *)
              index='${{ secrets.ES_INDEX_TEST }}'
              ;;
          esac
          python -u scripts/update_schemas.py \
            '${{ steps.app-token.outputs.token }}' \
            '${{ github.repository }}' \
            latest \
            "$index" \
            False

      - name: Create Pull Request
        if: github.event.client_payload.branch != '' && github.event.client_payload.branch != 'main' && github.event.client_payload.index == 'Live'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr create \
            --base main \
            --head '${{ github.event.client_payload.branch }}' \
            --title 'Merge ${{ github.event.client_payload.branch }} into main' \
            --body 'Automatically created after the mikroSDK database/schema update.'
