name: Remove/Update Devices in the Canonical Database

on:
  repository_dispatch:
    types: [trigger-workflow-update-database-devices]
  workflow_dispatch:
    inputs:
      select_index:
        type: choice
        description: Database channel
        options: [Development, Experimental, Live]
        default: Development
      select_action:
        type: choice
        description: Device update
        options: [Set sdk_support, Remove Devices]
        default: Set sdk_support
      regex:
        type: string
        description: Device UID regex, or "Spreadsheet Regex"
        default: PIC32MZ2048EFH144|MCU_CARD_10_FOR_KINETIS_MK60DN512VLQ10
      delete_device:
        type: boolean
        description: Delete matching Devices rows instead of disabling SDK support
        default: false
      xc8_specific:
        type: boolean
        description: Add XC8 support to matching devices
        default: false
      AI_generated_sdk:
        type: boolean
        description: Mark matching devices as AI-generated SDK
        default: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve request and update general_packages
        env:
          GENERAL_PACKAGES_TOKEN: ${{ secrets.MIKROE_ACTIONS_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_CHANNEL: ${{ github.event.client_payload.index }}
          DISPATCH_REGEX: ${{ github.event.client_payload.mcu_regex }}
          INPUT_CHANNEL: ${{ inputs.select_index }}
          INPUT_ACTION: ${{ inputs.select_action }}
          INPUT_REGEX: ${{ inputs.regex }}
          INPUT_DELETE: ${{ inputs.delete_device }}
          INPUT_XC8: ${{ inputs.xc8_specific }}
          INPUT_AI: ${{ inputs.AI_generated_sdk }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = repository_dispatch ]; then
            channel="$DISPATCH_CHANNEL"
            regex="$DISPATCH_REGEX"
            action=set-sdk-support
            delete_device=false
            xc8=false
            ai=false
          else
            channel="$INPUT_CHANNEL"
            regex="$INPUT_REGEX"
            if [ "$INPUT_ACTION" = 'Remove Devices' ]; then
              action=remove-devices
            else
              action=set-sdk-support
            fi
            delete_device="$INPUT_DELETE"
            xc8="$INPUT_XC8"
            ai="$INPUT_AI"
          fi

          args=(
            --channel "$channel"
            --operation devices
            --device-action "$action"
            --delete-device "$delete_device"
            --xc8-specific "$xc8"
            --ai-sdk "$ai"
            --wait
          )
          if [ "$regex" = 'Spreadsheet Regex' ]; then
            args+=(--spreadsheet-regex true)
          else
            args+=(--regex "$regex")
          fi
          python3 scripts/trigger_general_database_update.py "${args[@]}"

      - name: Notify Mattermost
        env:
          MATTERMOST_WEBHOOK_URL_SDK: ${{ secrets.MATTERMOST_WEBHOOK_URL_SDK }}
        run: |
          MESSAGE="**NECTO Devices Database Update Completed**\n\nThe canonical database was updated in general_packages and channel inheritance was applied automatically."
          curl -X POST -H 'Content-Type: application/json' \
            --data "{\"text\": \"$MESSAGE\"}" \
            "$MATTERMOST_WEBHOOK_URL_SDK"
