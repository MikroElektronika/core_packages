name: Release Codegrip Packages Separately

on:
  workflow_dispatch:
    inputs:
      select_index:
        type: choice
        description: Database/index channel
        options:
          - Test
          - Experimental
          - Live
      start_date:
        type: string
        description: First date for codegrip releases to release (better use csv, not spreadsheet to see the date)
        default: "2025-06-12"
      end_date:
        type: string
        description: Last date for codegrip releases (better use csv, not spreadsheet to see the date)
        default: "2025-06-13"

jobs:
  release-codegrip-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Authorize Mikroe Actions App
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.MIKROE_ACTIONS }}
          private-key: ${{ secrets.MIKROE_ACTIONS_KEY_AUTHORIZE }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements/shared.txt
          sudo apt-get install p7zip-full

      - name: Update database after CODEGRIP packaging
        env:
          GENERAL_PACKAGES_TOKEN: ${{ secrets.MIKROE_ACTIONS_KEY }}
        run: |
          python3 scripts/trigger_general_database_update.py \
            --channel '${{ github.event.inputs.select_index }}' \
            --operation refresh \
            --core-version latest \
            --sdk-version latest \
            --mcus-only false \
            --wait

      - name: Run Index Script
        env:
          ES_HOST: ${{ secrets.ES_HOST }}
          ES_USER: ${{ secrets.ES_USER }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_INDEX_TEST: ${{ secrets.ES_INDEX_TEST }}
          ES_INDEX_EXPERIMENTAL: ${{ secrets.ES_INDEX_EXPERIMENTAL }}
          ES_INDEX_LIVE: ${{ secrets.ES_INDEX_LIVE }}
        run: |
          if [[ ${{ github.event.inputs.select_index }} == "Test" ]]; then
            echo "Indexing to Test."
            python -u scripts/index_codegrip_packages.py ${{ secrets.ES_INDEX_TEST }} ${{ secrets.PROG_DEBUG_CODEGRIP_LIVE }} ${{ github.event.inputs.start_date }} ${{ github.event.inputs.end_date }} > message.txt
          elif [[ ${{ github.event.inputs.select_index }} == "Experimental" ]]; then
            echo "Indexing to Experimental."
            python -u scripts/index_codegrip_packages.py ${{ secrets.ES_INDEX_EXPERIMENTAL }} ${{ secrets.PROG_DEBUG_CODEGRIP_TEST }} ${{ github.event.inputs.start_date }} ${{ github.event.inputs.end_date }} > message.txt
          else
            echo "Indexing to Live."
            python -u scripts/index_codegrip_packages.py ${{ secrets.ES_INDEX_LIVE }} ${{ secrets.PROG_DEBUG_CODEGRIP_LIVE }} ${{ github.event.inputs.start_date }} ${{ github.event.inputs.end_date }} > message.txt
          fi

      - name: Send notification to Mattermost - SDK Team
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL_SDK }}
        run: |
          cat message.txt
          MESSAGE=$(cat message.txt)
          curl -X POST -H 'Content-Type: application/json' \
          --data "{\"text\": \"$MESSAGE\"}" \
          $MATTERMOST_WEBHOOK_URL
