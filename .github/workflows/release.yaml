name: Release Asset Upload

on:
  push:
    tags:
      - 'v*'

jobs:
  upload-release-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Authorize Mikroe Actions App
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.MIKROE_ACTIONS }}
          private-key: ${{ secrets.MIKROE_ACTIONS_KEY_AUTHORIZE }}
          owner: MikroElektronika
          repositories: |
            core_packages
            general_packages

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Clean the image
        uses: ./.github/actions/aggressive-cleanup

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements/shared.txt
          pip install -r scripts/requirements/release.txt
          sudo apt-get update
          sudo apt-get install -y p7zip-full


      - name: Download database from general_packages for packaging
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          rm -rf .central-db
          mkdir -p .central-db
          gh release download --repo MikroElektronika/general_packages --pattern 'database.7z' --dir .central-db
          7z x -y -o.central-db/content .central-db/database.7z >/dev/null
          cp .central-db/content/necto_db.db necto_db.db


      - name: Publish internal Core queries to latest release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          rm -f core_queries.7z
          7z a -t7z core_queries.7z ./resources/queries >/dev/null
          tag="$(gh release view --repo MikroElektronika/core_packages --json tagName --jq .tagName)"
          gh release upload "$tag" core_queries.7z --clobber --repo MikroElektronika/core_packages

      - name: Run Release Script
        env:
          DB_PATH: ${{ secrets.DB_PATH }}
          ES_HOST: ${{ secrets.ES_HOST }}
          ES_USER: ${{ secrets.ES_USER }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_INDEX: ${{ secrets.ES_INDEX_LIVE }}
          ES_INDEX_LIVE: ${{ secrets.ES_INDEX_LIVE }}
        run: python -u scripts/package.py ${{ steps.app-token.outputs.token }} ${{ github.repository }} ${{ github.ref_name }}

      - name: Trigger database update in general_packages
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api --method POST repos/MikroElektronika/general_packages/dispatches \
            -f event_type=database-update \
            -f 'client_payload[request_id]=core-${{ github.run_id }}' \
            -f 'client_payload[source_repo]=${{ github.repository }}' \
            -f 'client_payload[source_ref]=${{ github.ref_name }}' \
            -f 'client_payload[channel]=live' \
            -f 'client_payload[operation]=refresh' \
            -f 'client_payload[core_release]=latest' \
            -f 'client_payload[core_version]=${{ github.ref_name }}' \
            -f 'client_payload[sdk_version]=latest' \
            -F 'client_payload[mcus_only]=true'
